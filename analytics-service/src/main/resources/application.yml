spring:
  application:
    name: analytics-service

  datasource:
    url: jdbc:postgresql://localhost:5435/analytics_db
    username: analytics_user
    password: analytics_pass
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  gcp:
    project-id: cde-local
    pubsub:
      emulator-host: localhost:8085

logging:
  level:
    com.cde.analytics: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://analytics-db:5432/analytics_db
app:
  gcp:
    pubsub:
      emulator-host: pubsub-emulator:8085
