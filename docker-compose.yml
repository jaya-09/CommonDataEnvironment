version: '3.9'

# ═══════════════════════════════════════════════════════════════
# CDE Platform — Full Docker Compose
# Run with: docker compose up --build
# No local Java, Maven, or Node required — everything builds inside Docker
# ═══════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────
  # DATABASES — one isolated DB per service
  # ─────────────────────────────────────────

  plm-db:
    image: postgres:16-alpine
    container_name: cde-plm-db
    environment:
      POSTGRES_DB: plm_db
      POSTGRES_USER: plm_user
      POSTGRES_PASSWORD: plm_pass
    ports:
      - "5432:5432"
    volumes:
      - plm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plm_user -d plm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cde-network

  qlm-db:
    image: postgres:16-alpine
    container_name: cde-qlm-db
    environment:
      POSTGRES_DB: qlm_db
      POSTGRES_USER: qlm_user
      POSTGRES_PASSWORD: qlm_pass
    ports:
      - "5433:5432"
    volumes:
      - qlm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qlm_user -d qlm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cde-network

  llm-db:
    image: postgres:16-alpine
    container_name: cde-llm-db
    environment:
      POSTGRES_DB: llm_db
      POSTGRES_USER: llm_user
      POSTGRES_PASSWORD: llm_pass
    ports:
      - "5434:5432"
    volumes:
      - llm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llm_user -d llm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cde-network

  analytics-db:
    image: postgres:16-alpine
    container_name: cde-analytics-db
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: analytics_pass
    ports:
      - "5435:5432"
    volumes:
      - analytics-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_user -d analytics_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cde-network

  # ─────────────────────────────────────────
  # REDIS
  # ─────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: cde-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cde-network

  # ─────────────────────────────────────────
  # PUBSUB EMULATOR
  # ─────────────────────────────────────────

  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: cde-pubsub-emulator
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=cde-local
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8085/v1/projects/cde-local/topics | grep -qE '200|404' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - cde-network

  # ─────────────────────────────────────────
  # PUBSUB SETUP — runs once then exits
  # ─────────────────────────────────────────

  pubsub-setup:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: cde-pubsub-setup
    restart: "no"
    depends_on:
      pubsub-emulator:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        BASE="http://pubsub-emulator:8085/v1/projects/cde-local"

        echo "Waiting for pubsub emulator to be ready..."
        for i in $(seq 1 40); do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/topics" 2>/dev/null || echo "000")
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "404" ]; then
            echo "Emulator ready (status $STATUS)!"
            break
          fi
          echo "  attempt $i/40 (status=$STATUS)..."
          sleep 3
        done

        echo "=== Creating topics ==="
        for topic in \
          cde.plm.version.released \
          cde.plm.phase.transitioned \
          cde.plm.change.request.approved \
          cde.plm.phase.gate.check.requested \
          cde.plm.phase.gate.check.result \
          cde.plm.version.status.changed \
          cde.qlm.ncr.raised \
          cde.qlm.ncr.closed \
          cde.qlm.capa.raised \
          cde.qlm.capa.closed \
          cde.qlm.audit.finding \
          cde.qlm.risk.registered \
          cde.llm.certification.granted \
          cde.llm.user.profile.updated \
          cde.llm.enrollment.triggered; do
            curl -s -X PUT "$BASE/topics/$topic" > /dev/null 2>&1 || true
            echo "  topic ok: $topic"
        done

        echo "=== Creating subscriptions ==="

        # PLM subscriptions
        curl -s -X PUT "$BASE/subscriptions/plm-ncr-raised-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.qlm.ncr.raised\",\"pushConfig\":{\"pushEndpoint\":\"http://plm-service:8081/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        curl -s -X PUT "$BASE/subscriptions/plm-user-profile-updated-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.llm.user.profile.updated\",\"pushConfig\":{\"pushEndpoint\":\"http://plm-service:8081/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        curl -s -X PUT "$BASE/subscriptions/plm-phase-gate-check-result-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.plm.phase.gate.check.result\",\"pushConfig\":{\"pushEndpoint\":\"http://plm-service:8081/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        # QLM subscriptions
        curl -s -X PUT "$BASE/subscriptions/qlm-version-released-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.plm.version.released\",\"pushConfig\":{\"pushEndpoint\":\"http://qlm-service:8082/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        curl -s -X PUT "$BASE/subscriptions/qlm-change-request-approved-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.plm.change.request.approved\",\"pushConfig\":{\"pushEndpoint\":\"http://qlm-service:8082/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        curl -s -X PUT "$BASE/subscriptions/qlm-user-profile-updated-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.llm.user.profile.updated\",\"pushConfig\":{\"pushEndpoint\":\"http://qlm-service:8082/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        curl -s -X PUT "$BASE/subscriptions/qlm-phase-gate-check-requested-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.plm.phase.gate.check.requested\",\"pushConfig\":{\"pushEndpoint\":\"http://qlm-service:8082/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        # LLM subscriptions
        curl -s -X PUT "$BASE/subscriptions/llm-phase-transitioned-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.plm.phase.transitioned\",\"pushConfig\":{\"pushEndpoint\":\"http://llm-service:8083/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        curl -s -X PUT "$BASE/subscriptions/llm-ncr-raised-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.qlm.ncr.raised\",\"pushConfig\":{\"pushEndpoint\":\"http://llm-service:8083/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        curl -s -X PUT "$BASE/subscriptions/llm-audit-finding-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.qlm.audit.finding\",\"pushConfig\":{\"pushEndpoint\":\"http://llm-service:8083/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        curl -s -X PUT "$BASE/subscriptions/llm-phase-gate-check-requested-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.plm.phase.gate.check.requested\",\"pushConfig\":{\"pushEndpoint\":\"http://llm-service:8083/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        # Analytics subscriptions
        curl -s -X PUT "$BASE/subscriptions/analytics-version-released-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.plm.version.released\",\"pushConfig\":{\"pushEndpoint\":\"http://analytics-service:8084/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        curl -s -X PUT "$BASE/subscriptions/analytics-phase-transitioned-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.plm.phase.transitioned\",\"pushConfig\":{\"pushEndpoint\":\"http://analytics-service:8084/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        curl -s -X PUT "$BASE/subscriptions/analytics-ncr-raised-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.qlm.ncr.raised\",\"pushConfig\":{\"pushEndpoint\":\"http://analytics-service:8084/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        curl -s -X PUT "$BASE/subscriptions/analytics-capa-closed-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.qlm.capa.closed\",\"pushConfig\":{\"pushEndpoint\":\"http://analytics-service:8084/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        curl -s -X PUT "$BASE/subscriptions/analytics-certification-granted-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.llm.certification.granted\",\"pushConfig\":{\"pushEndpoint\":\"http://analytics-service:8084/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        curl -s -X PUT "$BASE/subscriptions/analytics-ncr-closed-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.qlm.ncr.closed\",\"pushConfig\":{\"pushEndpoint\":\"http://analytics-service:8084/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        curl -s -X PUT "$BASE/subscriptions/analytics-capa-raised-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.qlm.capa.raised\",\"pushConfig\":{\"pushEndpoint\":\"http://analytics-service:8084/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        curl -s -X PUT "$BASE/subscriptions/analytics-risk-registered-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.qlm.risk.registered\",\"pushConfig\":{\"pushEndpoint\":\"http://analytics-service:8084/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        curl -s -X PUT "$BASE/subscriptions/analytics-version-status-changed-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.plm.version.status.changed\",\"pushConfig\":{\"pushEndpoint\":\"http://analytics-service:8084/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        curl -s -X PUT "$BASE/subscriptions/analytics-enrollment-triggered-sub" \
          -H "Content-Type: application/json" \
          -d "{\"topic\":\"$BASE/topics/cde.llm.enrollment.triggered\",\"pushConfig\":{\"pushEndpoint\":\"http://analytics-service:8084/internal/events\"},\"ackDeadlineSeconds\":30}" || true

        echo "=== Pub/Sub setup complete ==="
    networks:
      - cde-network

  # ─────────────────────────────────────────
  # MICROSERVICES
  # context: . = project root (contains parent pom.xml)
  # dockerfile: points to service subfolder
  # Maven builds fully inside the JDK builder stage
  # ─────────────────────────────────────────

  llm-service:
    build:
      context: .
      dockerfile: llm-service/Dockerfile
    container_name: cde-llm-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://llm-db:5432/llm_db
      SPRING_DATASOURCE_USERNAME: llm_user
      SPRING_DATASOURCE_PASSWORD: llm_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: docker
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GCP_PROJECT_ID: cde-local
    depends_on:
      llm-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pubsub-setup:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - cde-network

  plm-service:
    build:
      context: .
      dockerfile: plm-service/Dockerfile
    container_name: cde-plm-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://plm-db:5432/plm_db
      SPRING_DATASOURCE_USERNAME: plm_user
      SPRING_DATASOURCE_PASSWORD: plm_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: docker
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GCP_PROJECT_ID: cde-local
      LLM_SERVICE_URL: http://llm-service:8083
    depends_on:
      plm-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pubsub-setup:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - cde-network

  qlm-service:
    build:
      context: .
      dockerfile: qlm-service/Dockerfile
    container_name: cde-qlm-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://qlm-db:5432/qlm_db
      SPRING_DATASOURCE_USERNAME: qlm_user
      SPRING_DATASOURCE_PASSWORD: qlm_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: docker
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GCP_PROJECT_ID: cde-local
    depends_on:
      qlm-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      pubsub-setup:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - cde-network

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    container_name: cde-analytics-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://analytics-db:5432/analytics_db
      SPRING_DATASOURCE_USERNAME: analytics_user
      SPRING_DATASOURCE_PASSWORD: analytics_pass
      SPRING_PROFILES_ACTIVE: docker
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      GCP_PROJECT_ID: cde-local
    depends_on:
      analytics-db:
        condition: service_healthy
      pubsub-setup:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - cde-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: cde-api-gateway
    ports:
      - "8080:8080"
    environment:
      PLM_SERVICE_URL: http://plm-service:8081
      QLM_SERVICE_URL: http://qlm-service:8082
      LLM_SERVICE_URL: http://llm-service:8083
      ANALYTICS_SERVICE_URL: http://analytics-service:8084
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - plm-service
      - qlm-service
      - llm-service
      - analytics-service
      - redis
    restart: on-failure
    networks:
      - cde-network

  # Frontend: Node build happens inside Docker, served by nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cde-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    restart: on-failure
    networks:
      - cde-network

volumes:
  plm-db-data:
  qlm-db-data:
  llm-db-data:
  analytics-db-data:
  redis-data:

networks:
  cde-network:
    driver: bridge