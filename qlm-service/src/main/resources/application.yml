spring:
  application:
    name: qlm-service
  datasource:
    url: jdbc:postgresql://localhost:5433/qlm_db
    username: qlm_user
    password: qlm_pass
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

app:
  gcp:
    project-id: cde-local
    pubsub:
      emulator-host: localhost:8085
  topics:
    # Domain topic — all QLM events go here (including phase gate results back to PLM).
    # Consumers subscribe to this topic and route internally by eventType.
    qlm-events: cde.qlm.events

resilience4j:
  retry:
    instances:
      pubsub-publish:
        max-attempts: 3                      # 1 original + 2 retries
        wait-duration: 500ms                 # 500ms → 1000ms (exponential)
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.lang.RuntimeException
          - java.io.IOException

  circuitbreaker:
    instances:
      pubsub-publish:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-calls-in-half-open-state: 2
        register-health-indicator: true

logging:
  level:
    com.cde.qlm: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://qlm-db:5432/qlm_db
  data:
    redis:
      host: redis
app:
  gcp:
    pubsub:
      emulator-host: pubsub-emulator:8085
