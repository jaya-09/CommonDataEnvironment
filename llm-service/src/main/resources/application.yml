spring:
  application:
    name: llm-service

  datasource:
    url: jdbc:postgresql://localhost:5434/llm_db
    username: llm_user
    password: llm_pass
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1

  cache:
    type: redis
    redis:
      time-to-live: 3600000   # 1 hour default TTL

  security:
    oauth2:
      resourceserver:
        jwt:
          # In prod: issuer-uri from Keycloak
          # For local dev without Keycloak, we disable security (see SecurityConfig)
          issuer-uri: http://localhost:8180/realms/cde

server:
  port: 8083
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# App-specific config
app:
  gcp:
    project-id: cde-local
    pubsub:
      emulator-host: localhost:8085   # empty in prod (uses ADC)
  topics:
    certification-granted: cde.llm.certification.granted
    user-profile-updated: cde.llm.user.profile.updated
    phase-gate-check-result: cde.plm.phase.gate.check.result
    enrollment-triggered: cde.llm.enrollment.triggered
  cache:
    skill-list-ttl: 21600       # 6 hours
    user-profile-ttl: 3600      # 1 hour
    cert-status-ttl: 900        # 15 min

logging:
  level:
    com.cde.llm: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://llm-db:5432/llm_db

  data:
    redis:
      host: redis

app:
  gcp:
    pubsub:
      emulator-host: pubsub-emulator:8085
