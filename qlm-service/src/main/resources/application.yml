spring:
  application:
    name: qlm-service
  datasource:
    url: jdbc:postgresql://localhost:5433/qlm_db
    username: qlm_user
    password: qlm_pass
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

app:
  gcp:
    project-id: cde-local
    pubsub:
      emulator-host: localhost:8085
  topics:
    ncr-raised: cde.qlm.ncr.raised
    capa-closed: cde.qlm.capa.closed
    audit-finding: cde.qlm.audit.finding

logging:
  level:
    com.cde.qlm: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://qlm-db:5432/qlm_db
  data:
    redis:
      host: redis
app:
  gcp:
    pubsub:
      emulator-host: pubsub-emulator:8085
